[project]
name = "peth"
version = "1.0.11"
description = "An all-in-one Ethereum SDK and command-line tool written in python."
authors = [{name = "Moon", email = "lmy375@139.com"}]
license = {text = "AGPL-3.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=6.20.0",
    "hexbytes>=1.2.0",
    "requests>=2.28.0",
    "pyyaml>=6.0.0",
    "py-solc-x>=1.1.1",
]

[project.urls]
Repository = "https://github.com/lmy375/peth/"
Documentation = "https://peth.readthedocs.io/"

[project.scripts]
peth = "peth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipython>=8.37.0",
    "isort>=8.0.1",
    "myst-parser>=4.0.1",
    "pytest>=7.0.0",
    "sphinx>=4.0.0",
    "sphinx-autobuild>=2021.0.0",
    "twine>=4.0.0",
]
